spring.application.name=dev-erp

# ==========================================
# BANCO DE DADOS
# ==========================================

spring.datasource.url=jdbc:postgresql://localhost:5439/erp_estoque
spring.datasource.username=postgres
spring.datasource.password=1234

spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=validate


# ==========================================
# FLYWAY
# ==========================================

spring.flyway.enabled=true

spring.flyway.locations=classpath:db/migration

spring.flyway.baseline-on-migrate=true

# ==========================================
# SEGURANCA E CONTROLE DE ACESSO
# Configure ERP_JWT_SECRET e ERP_ADMIN_SENHA no ambiente.
# ==========================================
erp.security.jwt-secret=${ERP_JWT_SECRET:dev-erp-jwt-secret-mude-esta-chave-antes-de-publicar}
erp.security.jwt-expiration-seconds=${ERP_JWT_EXPIRATION_SECONDS:28800}
erp.admin.nome=${ERP_ADMIN_NOME:Administrador do Sistema}
erp.admin.usuario=${ERP_ADMIN_USUARIO:admin}
erp.admin.senha=${ERP_ADMIN_SENHA:123456}
